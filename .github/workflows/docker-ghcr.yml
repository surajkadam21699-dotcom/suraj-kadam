name: Build and publish Docker image to GHCR

on:
  push:
      branches: [ main ]
        pull_request:
            types: [ opened, synchronize, reopened ]

            permissions:
              contents: read
                packages: write
                  id-token: write

                  env:
                    IMAGE_NAME: suraj-kadam

                    jobs:
                      build-and-push:
                          runs-on: ubuntu-latest
                              steps:
                                  - name: Checkout repository
                                        uses: actions/checkout@v4
                                            - name: Set up QEMU
                                                  uses: docker/setup-qemu-action@v2
                                                      - name: Set up Docker Buildx
                                                            uses: docker/setup-buildx-action@v3
                                                                - name: Log in to GitHub Container Registry
                                                                      uses: docker/login-action@v2
                                                                            with:
                                                                                    registry: ghcr.io
                                                                                            username: ${{ github.actor }}
                                                                                                    password: ${{ secrets.GITHUB_TOKEN }}
                                                                                                        - name: Set image tags
                                                                                                              id: tags
                                                                                                                    run: |
                                                                                                                            SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
                                                                                                                                    if [ "${{ github.event_name }}" = "push" ]; then
                                                                                                                                              echo "tags=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest,ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:$SHORT_SHA" >> $GITHUB_OUTPUT
                                                                                                                                                      else
                                                                                                                                                                echo "tags=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}-$SHORT_SHA" >> $GITHUB_OUTPUT
                                                                                                                                                                        fi
                                                                                                                                                                            - name: Build and push Docker image
                                                                                                                                                                                  uses: docker/build-push-action@v4
                                                                                                                                                                                        with:
                                                                                                                                                                                                context: .
                                                                                                                                                                                                        push: true
                                                                                                                                                                                                                tags: ${{ steps.tags.outputs.tags }}
