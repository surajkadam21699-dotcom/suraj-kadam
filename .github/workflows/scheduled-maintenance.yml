name: Scheduled maintenance

on:
  schedule:
      - cron: '0 3 * * *'
        workflow_dispatch:

        jobs:
          maintenance:
              runs-on: ubuntu-latest
                  steps:
                      - uses: actions/checkout@v4
                          - name: Node.js maintenance (install, build)
                                if: hashFiles('package.json') != ''
                                      uses: actions/setup-node@v4
                                            with:
                                                    node-version: '18'
                                                        - name: Install node dependencies
                                                              if: hashFiles('package.json') != ''
                                                                    run: |
                                                                            npm ci
                                                                                    npm run build --if-present
                                                                                        - name: Python maintenance (install, tests)
                                                                                              if: hashFiles('requirements.txt') != '' || hashFiles('pyproject.toml') != ''
                                                                                                    uses: actions/setup-python@v4
                                                                                                          with:
                                                                                                                  python-version: '3.10'
                                                                                                                      - name: Install python dependencies and run tests
                                                                                                                            if: hashFiles('requirements.txt') != '' || hashFiles('pyproject.toml') != ''
                                                                                                                                  run: |
                                                                                                                                          python -m pip install --upgrade pip
                                                                                                                                                  if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
                                                                                                                                                          if command -v pytest >/dev/null 2>&1; then pytest -q; else echo "No pytest configured"; fi
